<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="The four stakeholders of destination design: Pioneers, Local Leaders, Innovators, and Master Planners." font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="880" height="440" fill="#fbfaf8" rx="8"/>
  <!-- Quadrants -->
  <rect x="40" y="40" width="390" height="170" rx="6" fill="#BBD3F0" opacity="0.85"/>
  <rect x="450" y="40" width="390" height="170" rx="6" fill="#3d5a80"/>
  <rect x="40" y="230" width="390" height="170" rx="6" fill="#0b66d4" opacity="0.9"/>
  <rect x="450" y="230" width="390" height="170" rx="6" fill="#1b3d63" opacity="0.92"/>
  <!-- Divider cross -->
  <line x1="440" y1="40" x2="440" y2="400" stroke="#fbfaf8" stroke-width="4"/>
  <line x1="40" y1="220" x2="840" y2="220" stroke="#fbfaf8" stroke-width="4"/>
  <!-- Quadrant labels -->
  <text x="235" y="118" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.14em" fill="#3d5a80">01</text>
  <text x="235" y="158" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111416">Innovators</text>
  <text x="645" y="118" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.14em" fill="#7b8084">02</text>
  <text x="645" y="158" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#fbfaf8">Master Planners</text>
  <text x="235" y="308" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.14em" fill="#E6EFFA">03</text>
  <text x="235" y="348" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#fbfaf8">Pioneers</text>
  <text x="645" y="308" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.14em" fill="#DCE6F2">04</text>
  <text x="645" y="348" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#fbfaf8">Local Leaders</text>
</svg>
