<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="680" fill="#fbfaf8" rx="8"/>

  <!-- Axis labels -->
  <!-- Top: Institution-led -->
  <text x="440" y="38" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7b8084" letter-spacing="0.12em" text-transform="uppercase">INSTITUTION-LED</text>
  <!-- Bottom: Entrepreneur-led -->
  <text x="440" y="668" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7b8084" letter-spacing="0.12em">ENTREPRENEUR-LED</text>
  <!-- Left: Opportunistic -->
  <text x="28" y="345" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7b8084" letter-spacing="0.12em" transform="rotate(-90 28 345)">OPPORTUNISTIC</text>
  <!-- Right: Planned -->
  <text x="856" y="345" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7b8084" letter-spacing="0.12em" transform="rotate(90 856 345)">PLANNED</text>

  <!-- Grid quadrants -->
  <!-- Top-left: Innovators - warm sand/gold -->
  <rect x="60" y="55" width="380" height="290" rx="6" fill="#BBD3F0" opacity="0.85"/>
  <!-- Top-right: Master Planners - ink/slate -->
  <rect x="444" y="55" width="380" height="290" rx="6" fill="#3d5a80"/>
  <!-- Bottom-left: Pioneers - terracotta -->
  <rect x="60" y="349" width="380" height="290" rx="6" fill="#0b66d4" opacity="0.9"/>
  <!-- Bottom-right: Local Leaders - forest -->
  <rect x="444" y="349" width="380" height="290" rx="6" fill="#1b3d63" opacity="0.92"/>

  <!-- Divider lines (subtle cross) -->
  <line x1="440" y1="55" x2="440" y2="639" stroke="#fbfaf8" stroke-width="4"/>
  <line x1="60" y1="347" x2="824" y2="347" stroke="#fbfaf8" stroke-width="4"/>

