  <text x="250" y="92" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#111416" font-weight="400">Innovators</text>
  <text x="250" y="128" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="400">Resourced &amp; connected</text>
  <text x="250" y="150" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300">Opportunity spotters</text>
  <text x="250" y="172" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300">Calculated risk</text>
  <text x="250" y="194" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300">Trend-aware &amp; experimental</text>
  <text x="250" y="216" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300">Incubators &amp; reimaginers</text>
  <text x="250" y="238" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300">Commercially minded</text>
  <text x="250" y="266" text-anchor="middle" font-size="12.5" fill="#1b3d63" font-weight="300" font-style="italic">Failure is a learning opportunity</text>
