  <text x="250" y="386" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#fbfaf8" font-weight="400">Pioneers</text>
  <text x="250" y="422" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="400">Trend setters &amp; tastemakers</text>
  <text x="250" y="444" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300">First-movers</text>
  <text x="250" y="466" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300">Risk takers</text>
  <text x="250" y="488" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300">Gritty &amp; scrappy</text>
  <text x="250" y="510" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300">Instinct-driven</text>
  <text x="250" y="532" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300">Self-funded</text>
  <text x="250" y="560" text-anchor="middle" font-size="12.5" fill="#E6EFFA" font-weight="300" font-style="italic">Success is unexpected</text>
  <text x="250" y="588" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#CFE0F5" letter-spacing="0.05em">Creativity = A vision made real</text>

  <!-- ═══ BOTTOM-RIGHT: LOCAL LEADERS ═══ -->
  <text x="634" y="386" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#fbfaf8" font-weight="400">Local Leaders</text>
  <text x="634" y="422" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="400">Community-rooted</text>
  <text x="634" y="444" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300">Systems thinkers</text>
  <text x="634" y="466" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300">Trust builders</text>
  <text x="634" y="488" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300">Bespoke &amp; authentic</text>
  <text x="634" y="510" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300">Vision-driven</text>
  <text x="634" y="532" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300">Rule-aware</text>
  <text x="634" y="560" text-anchor="middle" font-size="12.5" fill="#DCE6F2" font-weight="300" font-style="italic">Failure has big consequences</text>
  <text x="634" y="588" text-anchor="middle" font-family="'Albert Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7FABE3" letter-spacing="0.05em">Creativity = Scaling a vision</text>

  <!-- Corner arrows / axis indicators -->
  <!-- Top arrow -->
  <line x1="440" y1="52" x2="440" y2="48" stroke="#e3e0da" stroke-width="1.5"/>
  <!-- Bottom arrow -->
  <line x1="440" y1="642" x2="440" y2="646" stroke="#e3e0da" stroke-width="1.5"/>
  <!-- Left arrow -->
  <line x1="57" y1="347" x2="53" y2="347" stroke="#e3e0da" stroke-width="1.5"/>
  <!-- Right arrow -->
  <line x1="827" y1="347" x2="831" y2="347" stroke="#e3e0da" stroke-width="1.5"/>

</svg>
