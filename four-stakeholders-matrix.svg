  <text x="634" y="150" text-anchor="middle" font-size="12.5" fill="#e3e0da" font-weight="300">Process-driven</text>
  <text x="634" y="172" text-anchor="middle" font-size="12.5" fill="#e3e0da" font-weight="300">Hierarchical &amp; role-defined</text>
  <text x="634" y="194" text-anchor="middle" font-size="12.5" fill="#e3e0da" font-weight="300">Prescriptive &amp; polished</text>
  <text x="634" y="216" text-anchor="middle" font-size="12.5" fill="#e3e0da" font-weight="300">Alignment-focused</text>
